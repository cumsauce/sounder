[package]
name = "sounder"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "MCP-driven procedural sound effects: a node graph rendered to WAV, with numeric and visual senses for agents that cannot hear"

[workspace]
members = [".", "crates/sfx_graph", "crates/sfx_analysis"]

[workspace.dependencies]
sfx_graph = { path = "crates/sfx_graph" }
sfx_analysis = { path = "crates/sfx_analysis" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
schemars = "1"
rayon = "1"
png = "0.18"
hound = "3.5"
realfft = "3"
# Foley's DSP (the user's repo), pinned to the rev phase 1 was written against.
foley-dsp = { git = "https://github.com/cumsauce/foley", rev = "963d67eb2de81bd43b008b30cc0109f875c940f1" }
foley-synth = { git = "https://github.com/cumsauce/foley", rev = "963d67eb2de81bd43b008b30cc0109f875c940f1" }

[workspace.lints.clippy]
unwrap_used = "deny"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
sfx_graph.workspace = true
sfx_analysis.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
png.workspace = true
base64 = "0.22"
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
wry = { version = "0.57.2", optional = true }
tao = { version = "0.37.2", optional = true }
cpal = { version = "0.18.2", optional = true }
vorbis_rs = { version = "0.5.6", default-features = false }

[features]
# `window` is the phase 5 webview (wry on tao) and brings audio with it;
# `audio` alone is playback (cpal) for the MCP `play` tool. A
# `--no-default-features` build is the headless server: no wry / tao / cpal.
default = ["window"]
audio = ["dep:cpal"]
window = ["audio", "dep:wry", "dep:tao"]

[lints]
workspace = true

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Synthesis and analysis run sample by sample: optimise them (and every
# dependency) in dev and test builds so renders stay quick.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.sfx_graph]
opt-level = 3

[profile.dev.package.sfx_analysis]
opt-level = 3

