<meta charset="utf-8">
<title>Sounder Window</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout (plan phase 5): top bar = which sound + transport (play, loop, seed, A/B); left = open sounds and the
   selected sound's nodes in signal order; centre = spectrogram / waveform / loudness with a playhead (or the node
   graph); bottom dock = history; right = node | sound | comments tabs. Tokens match modeler's ds.rs. Phase 5 ships
   this page in a webview with the Rust session behind it. The audio is real: the mock renders the same node JSON in the browser. */
:root {
  color-scheme: dark;
  --bg: #15171c; --panel: #1c1f26; --raise: #252932; --line: #2e333e;
  --fg: #e3e6ec; --dim: #8a91a0; --faint: #5b6270;
  --accent: #6fa8ff; --accent-soft: rgba(111,168,255,.14);
  --ok: #5fc48a; --warn: #e2b24f; --bad: #ec6d6d;
  --a1: #c792ea; --a2: #f6a04d; --a3: #4fd1c5;
  --b: #f6a04d;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--sans); overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 12px; }
.app { display: grid; height: 100%; grid-template-rows: 48px 1fr; position: relative; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.where { display: flex; align-items: stretch; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; min-width: 0; }
.where > button { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 6px; color: var(--dim); white-space: nowrap; min-width: 0; }
.where > button[aria-pressed="true"] { background: var(--raise); color: var(--fg); }
.where .count { font: 11px var(--mono); background: var(--raise); border-radius: 99px; padding: 0 6px; color: var(--dim); }
.where > button[aria-pressed="true"] .count { background: var(--bg); }
.docname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.docproj { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
.transport { display: flex; align-items: center; gap: 6px; }
.transport[hidden] { display: none !important; }
.play { width: 34px; height: 30px; border-radius: 7px; background: var(--accent); color: #08162b; display: grid; place-items: center; }
.play svg.i { fill: currentColor; stroke: none; }
.tbtn { display: flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 6px; color: var(--dim); border: 1px solid var(--line); white-space: nowrap; }
.tbtn:hover { color: var(--fg); background: var(--raise); }
.tbtn[aria-pressed="true"] { color: var(--fg); background: var(--raise); border-color: var(--faint); }
.tbtn kbd, .seg kbd, .tabs kbd { font: 10px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.seed { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seed button { padding: 5px 7px; color: var(--dim); }
.seed button:hover { color: var(--fg); background: var(--raise); }
.seed span { font: 12px var(--mono); padding: 0 6px; min-width: 52px; text-align: center; }
.hearing { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 99px; background: var(--raise); white-space: nowrap; }
.hearing b { color: var(--fg); font-weight: 500; }
.hearing button { color: var(--faint); display: grid; place-items: center; }
.hearing button:hover { color: var(--fg); }
.spacer { flex: 1; }
.agents { display: flex; align-items: center; gap: 4px; }
.agent { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 6px; border-radius: 99px; background: var(--raise); font-size: 12px; color: var(--dim); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.live { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.iconbtn { padding: 5px 9px; border-radius: 6px; color: var(--dim); border: 1px solid var(--line); }
.iconbtn:hover { color: var(--fg); background: var(--raise); }

/* document switcher */
.docpop { position: absolute; top: 44px; left: 10px; width: 360px; max-width: calc(100vw - 20px); max-height: min(520px, 70vh); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); z-index: 30; }
.docpop[hidden], .bpop[hidden] { display: none !important; }
.docpop input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; margin: 8px; padding: 7px 9px; color: var(--fg); font: inherit; }
.docpop .list { overflow: auto; padding: 0 6px 8px; }
.docrow { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.docrow:hover, .docrow.on { background: var(--raise); }
.docrow .r { color: var(--faint); font-size: 11px; text-align: right; white-space: nowrap; }
.bpop { position: absolute; top: 44px; width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); z-index: 30; padding: 6px; }
.bpop .h { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 6px 8px; }

/* workspace */
.work { display: grid; grid-template-columns: 250px 1fr 300px; grid-template-rows: 1fr auto; min-height: 0; }
.left, .right { background: var(--panel); min-height: 0; overflow: auto; }
.left { border-right: 1px solid var(--line); grid-row: 1 / 3; overflow-x: hidden; }
.right { border-left: 1px solid var(--line); grid-row: 1 / 3; grid-column: 3; display: flex; flex-direction: column; }
.paneh { position: sticky; top: 0; background: var(--panel); z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.paneh .badge { text-transform: none; letter-spacing: 0; }
.tree { padding: 0 6px 12px; }
.row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; min-width: 0; color: var(--fg); position: relative; }
.row:hover { background: var(--raise); }
.row.sel { background: var(--accent-soft); }
.row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .meta { color: var(--faint); font-size: 11px; }
.row svg.i { color: var(--dim); }
.row canvas.spark { width: 46px; height: 16px; flex: none; opacity: .9; }
.row .solo { color: var(--faint); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; opacity: 0; }
.row:hover .solo, .row .solo.on, .row .solo:focus-visible { opacity: 1; }
.row .solo:hover { color: var(--fg); background: var(--bg); }
.row .solo.on { color: var(--accent); }
.row.out .name { font-weight: 600; }
.row .pinc { font: 600 10px var(--sans); background: var(--warn); color: #1b1600; border-radius: 99px; padding: 0 5px; }
.row .warnc { color: var(--warn); display: grid; place-items: center; }
.row.child { padding-left: 14px; }
.badge { font: 10px var(--mono); padding: 0 5px; border-radius: 4px; background: var(--raise); color: var(--dim); white-space: nowrap; }
.badge.loop { color: var(--a3); } .badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); }
.wire { color: var(--faint); font: 11px var(--mono); padding: 0 6px 0 30px; height: 10px; line-height: 8px; }

/* centre */
.view { position: relative; min-height: 0; min-width: 0; display: grid; grid-template-rows: 40px 1fr; background: #121418; }
.hudbar { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; overflow: hidden; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px; flex: none; }
.seg button { padding: 3px 9px; border-radius: 4px; color: var(--dim); font-size: 12px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--fg); }
.chip { background: rgba(21,23,28,.85); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip b { color: var(--fg); font-weight: 500; }
.chip button { color: var(--faint); display: grid; place-items: center; }
.chip button:hover { color: var(--fg); }
.chip.warn { border-color: rgba(226,178,79,.5); color: var(--warn); }
.plot { position: relative; min-height: 0; overflow: hidden; }
.plot > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.plot canvas#ov { cursor: crosshair; }
.regbar { position: absolute; display: flex; gap: 4px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45); z-index: 4; }
.regbar[hidden] { display: none !important; }
.regbar button { display: flex; gap: 6px; align-items: center; padding: 4px 8px; border-radius: 5px; color: var(--dim); font-size: 12px; white-space: nowrap; }
.regbar button:hover { background: var(--raise); color: var(--fg); }
.regbar .sep { width: 1px; background: var(--line); margin: 2px 0; }
.pinb { position: absolute; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: var(--warn); color: #1b1600; font: 600 11px var(--sans); display: grid; place-items: center; cursor: pointer; z-index: 3; border: 2px solid #121418; }
.pinb.done { background: var(--faint); color: var(--bg); }
.graphhost[hidden] { display: none !important; }
.graphhost { position: absolute; inset: 0; overflow: auto; background-color: #181a20; background-image: radial-gradient(#2a2f3a 1px, transparent 1px); background-size: 18px 18px; }
.graph { position: relative; margin: 24px; }
.graph svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.gnode { position: absolute; width: 150px; padding: 6px 8px 5px; background: var(--raise); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
.gnode.sel { border-color: var(--accent); }
.gnode.solo { box-shadow: 0 0 0 2px rgba(111,168,255,.35); }
.gnode .n { font-size: 12px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; }
.gnode .t { font: 10.5px var(--mono); color: var(--faint); line-height: 1.2; }
.gnode canvas { width: 100%; height: 22px; display: block; margin-top: 4px; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; }
.toast[hidden] { display: none !important; }

/* history dock */
.dock { grid-column: 2; border-top: 1px solid var(--line); background: var(--panel); min-width: 0; }
.dock[hidden] { display: none !important; }
.dockh { display: flex; align-items: center; gap: 10px; padding: 6px 12px; font-size: 12px; color: var(--dim); }
.dockh .t { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.dockh .grow { flex: 1; }
.knobs { display: flex; gap: 8px; padding: 0 12px 10px; overflow-x: auto; }
.knob { flex: none; width: 104px; padding: 8px 8px 7px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; }
.knob.hot { border-color: var(--accent); }
.knob .kn { font-weight: 600; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
.knob svg.dial { width: 66px; height: 60px; cursor: ns-resize; touch-action: none; outline: none; }
.knob svg.dial:focus-visible { outline: 2px solid var(--accent); border-radius: 50%; }
.knob .kval { font: 12px var(--mono); display: flex; gap: 6px; align-items: baseline; }
.knob .kval .moved { color: var(--a3); font-size: 10.5px; }
.knob .claimx { font-size: 11px; color: var(--faint); text-align: center; line-height: 1.3; min-height: 29px; }
.knob .claimx b { font-weight: 500; }
.knob .claimx .ok { color: var(--ok); } .knob .claimx .bad { color: var(--bad); }
.game { font: 600 9.5px var(--mono); color: #04201d; background: var(--a3); border-radius: 3px; padding: 0 4px; letter-spacing: .03em; }
.knob.add { justify-content: center; color: var(--faint); border-style: dashed; font-size: 12px; text-align: center; padding: 10px; }
.kpop { position: fixed; z-index: 20; width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 14px 40px rgba(0,0,0,.5); padding: 9px 11px; font-size: 12px; pointer-events: none; }
.kpop[hidden] { display: none !important; }
.kpop .d { color: var(--dim); margin-bottom: 6px; }
.kpop .m { font: 11.5px var(--mono); display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
.kpop .m span:nth-child(even) { color: var(--dim); text-align: right; }
.kpop .who { color: var(--faint); margin-top: 6px; font-size: 11px; }
.kpop .who .ok { color: var(--ok); } .kpop .who .bad { color: var(--bad); } .kpop .who b { color: var(--fg); font-weight: 500; }
.row.mac { box-shadow: inset 2px 0 0 var(--accent); background: var(--accent-soft); }
.gnode.mac { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.macchip { font: 11px var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 6px; cursor: pointer; }
.fb { font-size: 12px; display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; }
.fb span:nth-child(even) { color: var(--faint); font-size: 11px; }
.hstep { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.hstep:hover { background: var(--raise); }
.hstep .l { font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hstep .tagA, .hstep .tagB { font: 600 10px var(--mono); border-radius: 3px; padding: 0 4px; }
.hstep .tagA { background: var(--accent); color: #08162b; } .hstep .tagB { background: var(--b); color: #1f1300; }

/* right pane */
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { padding: 6px 10px; color: var(--dim); border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
.tabs .n { font: 10px var(--mono); background: var(--warn); color: #1b1600; border-radius: 99px; padding: 0 5px; }
.sect { padding: 8px 12px 14px; border-bottom: 1px solid var(--line); }
.sect:last-child { border-bottom: 0; }
.sh { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 2px 0 8px; display: flex; justify-content: space-between; align-items: center; }
.nodehead { display: flex; align-items: center; gap: 8px; }
.nodehead .nm { font-weight: 600; font-size: 14px; }
.blurb { color: var(--dim); font-size: 12px; margin-top: 4px; }
.field { display: grid; grid-template-columns: 78px 1fr 62px; gap: 8px; align-items: center; margin: 6px 0; font-size: 12px; }
.field label { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.field input[type=range] { width: 100%; accent-color: var(--accent); }
.field .val { font: 12px var(--mono); text-align: right; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.field .link { grid-column: 2 / 4; display: flex; gap: 6px; align-items: center; }
.field .link button { font: 12px var(--mono); padding: 1px 7px; border-radius: 5px; background: var(--bg); border: 1px solid var(--line); color: var(--accent); }
.field .link button:hover { border-color: var(--accent); }
.field .opts { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 3px; }
.field .opts button { font: 11px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); }
.field .opts button[aria-pressed="true"] { color: var(--fg); background: var(--raise); border-color: var(--faint); }
.field pre { grid-column: 2 / 4; margin: 0; font: 11px var(--mono); color: var(--dim); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 5px 7px; white-space: pre-wrap; max-height: 120px; overflow: auto; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 8px; font-size: 12px; margin: 0; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.bt { display: grid; grid-template-columns: 34px repeat(5, 1fr); gap: 2px; font: 10px var(--mono); }
.bt span { text-align: center; padding: 3px 0; border-radius: 2px; color: rgba(255,255,255,.88); }
.bt .lab { color: var(--faint); text-align: right; padding-right: 4px; background: none; }
.bt .hd { color: var(--faint); background: none; }
.chk { display: grid; grid-template-columns: 38px 1fr; gap: 0 8px; font-size: 12px; padding: 3px 0; }
.chk .p { font: 600 10px var(--mono); padding: 1px 0; border-radius: 3px; text-align: center; height: 16px; }
.chk .p.ok { background: rgba(95,196,138,.18); color: var(--ok); } .chk .p.bad { background: rgba(236,109,109,.18); color: var(--bad); }
.chk .d { color: var(--dim); } .chk .d b { color: var(--fg); font-weight: 500; }
.wrn { color: var(--warn); font-size: 12px; display: flex; gap: 6px; padding: 3px 0; }
.cmt { display: grid; grid-template-columns: 22px 1fr; gap: 0 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12.5px; }
.cmt:hover { background: rgba(255,255,255,.02); }
.cmt .num { width: 20px; height: 20px; border-radius: 50%; background: var(--warn); color: #1b1600; font: 600 11px var(--sans); display: grid; place-items: center; }
.cmt.done .num { background: var(--faint); color: var(--bg); }
.cmt .hd { display: flex; gap: 6px; align-items: baseline; margin-bottom: 2px; flex-wrap: wrap; }
.cmt .hd b { font-weight: 500; } .cmt .hd span { color: var(--faint); font-size: 11px; }
.cmt .on { font: 11px var(--mono); color: var(--dim); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.cmt .reply { margin-top: 8px; padding-left: 10px; border-left: 2px solid var(--line); color: var(--dim); }
.cmt .reply .hd b { color: var(--fg); }
.compose { padding: 10px 12px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--panel); }
.compose .pinto { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); margin-bottom: 6px; flex-wrap: wrap; }
.compose .row2 { display: flex; gap: 6px; }
.compose input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: var(--fg); font: inherit; }
.primary { background: var(--accent); color: #08162b; padding: 6px 10px; border-radius: 6px; font-weight: 600; }
.primary:disabled { opacity: .4; }
.hint { color: var(--faint); font-size: 12px; }
.grow { flex: 1; }

/* grid of all sounds */
.overview { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; background: var(--bg); display: grid; grid-template-columns: 1fr 280px; z-index: 5; }
.overview[hidden] { display: none !important; }
.ovgrid { padding: 14px; overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; align-content: start; }
.ovsec { grid-column: 1 / -1; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding-top: 4px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
.tile:hover { border-color: var(--faint); }
.tile .thumb { aspect-ratio: 16/9; max-width: 100%; position: relative; background: #121418; }
.tile .thumb canvas { width: 100%; height: 100%; display: block; }
.tile .tp { position: absolute; right: 8px; bottom: 8px; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #08162b; display: grid; place-items: center; opacity: 0; }
.tile .tp svg.i { fill: currentColor; stroke: none; }
.tile:hover .tp, .tile .tp:focus-visible { opacity: 1; }
.tile .working { position: absolute; left: 8px; top: 8px; }
.tile .info { padding: 8px 10px; display: flex; gap: 6px; align-items: center; }
.tile .info .n { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .sub { padding: 0 10px 8px; color: var(--faint); font-size: 12px; display: flex; gap: 8px; }
.ovside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; }
.feed { font-size: 12px; }
.feed .ev { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; cursor: pointer; }
.feed .ev time { color: var(--faint); font-family: var(--mono); font-size: 11px; }
.feed .ev .what { color: var(--dim); } .feed .ev .what b { color: var(--fg); font-weight: 500; }

/* concept notes */

  const lg = /freq|from|to$|^to|root|hz/.test(key), t = /time|decay|attack|release|duration/.test(key);
  if (lg) return { min: Math.log(20), max: Math.log(20000), step: 0.001, to: Math.exp, from: Math.log, fmt: x => fmtHz(x) + ' Hz' };
  if (t) return { min: Math.log(0.001), max: Math.log(4), step: 0.001, to: Math.exp, from: Math.log, fmt: x => x < 0.1 ? (x * 1000).toFixed(0) + ' ms' : x.toFixed(2) + ' s' };
  if (key === 'q') return { min: 0.3, max: 20, step: 0.05, fmt: x => x.toFixed(2) };
  if (/db|lufs/.test(key)) return { min: key === 'lufs' ? -40 : -24, max: key === 'lufs' ? -6 : 24, step: 0.5, fmt: x => x.toFixed(1) + (key === 'lufs' ? '' : ' dB') };
  if (key === 'b' || key === 'gain' || key === 'drive') return { min: 0, max: 8, step: 0.05, fmt: x => x.toFixed(2) };
  return { min: 0, max: 1, step: 0.01, fmt: x => x.toFixed(2) };
}
function fieldRow(n, k, v) {
  const d = doc(), names = new Set(d.nodes.map(x => x.name));
  const by = d.macros.filter(m => m.map.some(x => x.node === n.name && x.field === k));
  if (by.length) { const eff = R && R.list.find(x => x.name === n.name); const ev = eff ? eff[k] : v; const show = typeof ev === 'number' ? (slider(k).fmt(ev)) : JSON.stringify(ev);
    return `<div class="field"><label>${k}</label><div class="link">${by.map(m => `<span class="macchip" data-kfocus="${m.name}" title="Turn the ${m.name} knob">◎ ${m.name}</span>`).join('')}<span class="val grow" style="text-align:right" title="${JSON.stringify(ev)}">${show}</span></div></div>`; }
  if (ENUMS[k] && typeof v === 'string') return `<div class="field"><label>${k}</label><div class="opts">${ENUMS[k].map(o => `<button data-enum="${k}" data-v="${o}" aria-pressed="${o === v}">${o}</button>`).join('')}</div></div>`;
  if (typeof v === 'string' && names.has(v.split('.')[0])) return `<div class="field"><label>${k}</label><div class="link"><button data-goto="${v}" title="Select ${v}">← ${v}</button><span class="hint">signal</span></div></div>`;
  if (typeof v === 'string' && /^[$=]/.test(v)) return `<div class="field"><label>${k}</label><div class="link"><span class="mono" style="color:var(--a3)">${v}</span></div></div>`;
  if (typeof v === 'number') { const s = slider(k, v); const pos = s.from ? s.from(Math.max(v, 1e-6)) : v; return `<div class="field"><label>${k}</label><input type="range" data-num="${k}" min="${s.min}" max="${s.max}" step="${s.step}" value="${pos}"><span class="val" data-numv="${k}">${s.fmt(v)}</span></div>`; }
  return `<div class="field"><label>${k}</label><pre>${JSON.stringify(v)}</pre></div>`;
}
function renderRight() {

  const tabs = `<div class="tabs" role="tablist">${[['node', 'Node'], ['sound', 'Sound'], ['comments', 'Comments']].map(([k, l]) => `<button role="tab" data-tab="${k}" aria-selected="${S.tab === k}">${l}${k === 'comments' && open ? `<span class="n">${open}</span>` : ''}</button>`).join('')}</div>`;
  let body = '';
  if (S.tab === 'node') {
    if (!n) body = `<div class="sect hint">Select a node on the left or in the graph.</div>`;
    else { const readBy = d.nodes.filter(x => reads(x).includes(n.name)).map(x => x.name); const nb = R && R.bufs[n.name]; let pk = 0; if (nb) for (const v of nb) pk = Math.max(pk, Math.abs(v));
      body = `<div class="sect"><div class="nodehead">${ic(ICON[n.type])}<span class="nm">${n.name}</span><span class="badge">${n.type}</span><span class="grow"></span><button class="tbtn" data-solo="${n.name}" aria-pressed="${S.solo === n.name}" title="Hear this node">${ic('phones')}Solo</button></div><div class="blurb">${BLURB[n.type] || ''}</div></div>
      <div class="sect"><div class="sh">Fields</div>${Object.entries(n).filter(([k]) => k !== 'type' && k !== 'name').map(([k, v]) => fieldRow(n, k, v)).join('')}</div>
      <div class="sect"><div class="sh">Wiring</div><dl class="kv"><dt>reads</dt><dd>${reads(n).filter(x => d.nodes.some(y => y.name === x)).map(x => `<a href="#" data-goto="${x}" style="color:var(--accent)">${x}</a>`).join(', ') || '—'}</dd><dt>read by</dt><dd>${readBy.map(x => `<a href="#" data-goto="${x}" style="color:var(--accent)">${x}</a>`).join(', ') || (n.type === 'output' ? 'the sound' : '<span style="color:var(--warn)">nothing</span>')}</dd><dt>peak</dt><dd>${(20 * Math.log10(Math.max(pk, 1e-10))).toFixed(1)} dBFS</dd></dl></div>
      <div class="sect"><div class="sh">JSON <span class="hint" style="text-transform:none;letter-spacing:0">what sound_ops sends</span></div><pre class="mono" style="margin:0;white-space:pre-wrap;color:var(--dim);font-size:11px">${JSON.stringify(n)}</pre></div>`; }
  } else if (S.tab === 'sound') {
    const ins = Object.entries(d.inputs || {}); const bmax = -6, bmin = -72;
    const cell = v => { const t = Math.max(0, Math.min(1, (v - bmin) / (bmax - bmin))); const c = cmap(t * 0.92 + 0.04); return `<span style="background:rgb(${c.map(Math.round)})" title="${v.toFixed(1)} dB">${v < -99 ? '' : Math.round(v)}</span>`; };
    const checks = D ? [['finite', true, 'every sample finite'], ['peak_db', D.peak <= -0.3, `<b>${D.peak.toFixed(2)}</b> dBFS (max -0.3)`], ['silent_edges', D.first < 1e-3 && D.last < 1e-3, `edges at <b>${(20 * Math.log10(Math.max(D.first, 1e-10))).toFixed(0)}</b> / <b>${(20 * Math.log10(Math.max(D.last, 1e-10))).toFixed(0)}</b> dBFS`], ['dc', D.dc <= -40, `<b>${D.dc.toFixed(0)}</b> dB (max -40)`], ['rebuild', true, 'uncached re-render bit-identical']] : [];
    if (d.kind === 'loop') checks.push(['loop_seam', true, 'wrap 1.1x the typical step']);
    d.macros.forEach(m => { const c = MCHK_get(d, m); if (c) checks.push([`macro ${m.name}`, c.pass, `${CLAIMS[m.claim[0]].label} ${m.claim[1] > 0 ? 'rises' : 'falls'} over 0..1: ${c.vals.map(v => CLAIMS[m.claim[0]].fmt(v).split(' ')[0]).join(' → ')}${c.clip != null ? `; clips at ${c.clip}` : ''}`]); });
    const warns = unread(d).map(x => `node ${x} is not read by anything`);
    body = `<div class="sect"><div class="sh">Sound</div><dl class="kv"><dt>kind</dt><dd>${d.kind}</dd><dt>duration</dt><dd>${d.duration ? d.duration + ' s' : 'auto (until -80 dBFS)'}</dd><dt>seed</dt><dd>${d.seed}</dd><dt>sample rate</dt><dd>48000 (mock: 44100)</dd><dt>causal</dt><dd>${d.nodes.some(x => x.type === 'output' && x.lufs != null) ? 'no: output lufs' : 'yes'}</dd></dl></div>
      ${d.macros.length ? `<div class="sect"><div class="sh">Macros <span class="hint" style="text-transform:none;letter-spacing:0">by ${d.by}</span></div>${d.macros.map(m => `<div style="margin:0 0 9px"><div style="display:flex;gap:6px;align-items:center"><span class="macchip" data-kfocus="${m.name}">◎ ${m.name}</span>${m.game ? '<span class="game">GAME</span>' : ''}<span class="grow"></span><span class="mono">${m.value.toFixed(2)}</span><span class="hint">default ${m.default.toFixed(2)}</span></div><div class="hint" style="margin:3px 0">${m.doc}</div><div class="fb">${m.map.map(x => mapText(x).map(t => `<span class="mono" style="font-size:11px">${t}</span>`).join('')).join('')}</div></div>`).join('')}</div>` : ''}
      ${d.feedback.length ? `<div class="sect"><div class="sh">Your moves <span class="hint" style="text-transform:none;letter-spacing:0">agents see these in summary</span></div><div class="fb">${d.feedback.map(f => `<span>${f.name} <span class="mono">${f.from.toFixed(2)} → ${f.to.toFixed(2)}</span></span><span>${f.ago}</span>`).join('')}</div><div class="hint" style="margin-top:6px">An agent can keep them as the new defaults, or re-centre a knob's range around where you left it.</div></div>` : ''}
      ${ins.length || Object.keys(d.params).length ? `<div class="sect"><div class="sh">Inputs & params <span class="hint" style="text-transform:none;letter-spacing:0">inputs go to the game</span></div>${ins.map(([k, s]) => `<div class="field"><label title="${s.doc || ''}">$${k}</label><input type="range" data-input="${k}" min="${s.min}" max="${s.max}" step="0.01" value="${s.value ?? s.default}"><span class="val" data-inputv="${k}">${(s.value ?? s.default).toFixed(2)}</span></div>${s.doc ? `<div class="hint" style="margin:-4px 0 6px 86px">${s.doc}</div>` : ''}`).join('')}${Object.entries(d.params).map(([k, v]) => `<div class="field"><label>$${k}</label><input type="range" data-param="${k}" min="${Math.log(50)}" max="${Math.log(5000)}" step="0.001" value="${Math.log(v)}"><span class="val" data-paramv="${k}">${Math.round(v)}</span></div>`).join('')}</div>` : ''}
      <div class="sect"><div class="sh">Checks <span class="badge ${checks.every(c => c[1]) ? 'ok' : 'bad'}">${checks.filter(c => c[1]).length}/${checks.length}</span></div>${checks.map(([k, p, t]) => `<div class="chk"><span class="p ${p ? 'ok' : 'bad'}">${p ? 'PASS' : 'FAIL'}</span><span class="d">${k}: ${t}</span></div>`).join('')}${warns.map(w => `<div class="wrn">${ic('warn')}${w}</div>`).join('')}</div>
      ${D ? `<div class="sect"><div class="sh">Bands (dB) × time</div><div class="bt"><span class="lab"></span>${['0', '20', '40', '60', '80%'].map(h => `<span class="hd">${h}</span>`).join('')}${[...D.bands].map((row, b) => `<span class="lab">${BLAB[b]}</span>${row.map(cell).join('')}`).reverse().join('')}</div></div>

    const pin = S.pendingPin || (S.sel ? { node: S.sel } : {});
    body += `<div class="grow"></div><div class="compose"><div class="pinto">${ic('pin')} on <span class="on mono" style="border:1px solid var(--line);border-radius:4px;padding:0 5px">${pinText(pin)}</span>${S.pendingPin ? '<button class="hint" data-unpin>(whole sound)</button>' : ''}</div><div class="row2"><input id="cin" placeholder="What do you hear?" autocomplete="off"><button class="primary" id="csend">Post</button></div></div>`;
  }

function renderOverview() {
  $('#overview').hidden = S.view !== 'grid'; if (S.view !== 'grid') return;
  $('#ovgrid').innerHTML = `<div class="ovsec">friendSLOP · ${DOCS.length} open</div>` + DOCS.map(d => `<div class="tile" data-doc="${d.id}" tabindex="0"><div class="thumb"><canvas data-th="${d.id}"></canvas>${d.working ? `<span class="chip working" style="font-size:11px"><i class="dot live" style="background:${AGENTS[d.by].color}"></i>${d.by} editing</span>` : ''}<button class="tp" data-audition="${d.id}" aria-label="Play ${d.id}">${ic('play')}</button></div><div class="info"><span class="n">${d.id}</span><span class="badge ${d.kind === 'loop' ? 'loop' : ''}">${d.kind}</span></div><div class="sub"><span class="grow" data-tl="${d.id}"></span><span>${d.by} · ${d.ago}${d.saved ? '' : ' · <span style="color:var(--warn)">unsaved</span>'}</span></div></div>`).join('');
  $('#feed').innerHTML = FEED.map(([a, tool, what, t, id]) => `<div class="ev" data-doc="${id}"><i class="dot" style="background:${AGENTS[a].color}"></i><span class="what"><span class="mono">${tool}</span> ${what}</span><time>${t}</time></div>`).join('');
  requestAnimationFrame(() => document.querySelectorAll('[data-th]').forEach(c => { const d = DOCS.find(x => x.id === c.dataset.th); const r = evaluate(d, d.seed, null); const W = c.width = c.clientWidth, H = c.height = c.clientHeight; drawSpectrogram(c.getContext('2d'), r.audio, 0, 0, W, H, [0, r.audio.length / SR], [20, 20000]); $(`[data-tl="${d.id}"]`).textContent = `${(r.audio.length / SR).toFixed(2)} s · ${lufs(r.audio).toFixed(1)} LUFS`; }));
}
function audition(id) { const d = DOCS.find(x => x.id === id); const r = evaluate(d, d.seed, null); const ac = ensureAC(); stop(); const buf = ac.createBuffer(1, r.audio.length, SR); buf.copyToChannel(r.audio, 0); const s = ac.createBufferSource(); s.buffer = buf; s.connect(ac.destination); s.start(); }

function toast(t) { const e = $('#toast'); e.innerHTML = `<span class="chip"><b>${t}</b></span>`; e.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => e.hidden = true, 2600); }

function renderCentre() { renderHud(); renderGraph(); requestAnimationFrame(() => { renderPlot(); showRegbar(); }); }
function renderAll() { renderTop(); renderOverview(); renderLeft(); renderCentre(); renderDock(); renderRight(); renderNotes(); }
function commit(label) { const d = doc(); d.ver = d.hist[d.hist.length - 1].v + 1; d.hist.push({ v: d.ver, label, by: 'you', ago: 'now', nodes: clone(d.nodes) }); d.saved = false; rerender(); renderAll(); restartKeeping(); }

  const go = e.target.closest('[data-goto]'); if (go) { e.preventDefault(); S.sel = go.dataset.goto.split('.')[0]; renderLeft(); renderRight(); renderGraph(); return; }
  const en = e.target.closest('[data-enum]'); if (en) { const d = doc(); d.nodes = edit(d.nodes, S.sel, { [en.dataset.enum]: en.dataset.v }); commit(`~${S.sel}`); return; }
  const cm = e.target.closest('[data-cmt]'); if (cm) { const c = doc().comments.find(x => x.n == cm.dataset.cmt); if (c.on.node) S.sel = c.on.node; if (c.on.t) { S.region = { t: c.on.t, hz: c.on.hz }; showRegbar(); } renderLeft(); return; }
  if (e.target.closest('[data-unpin]')) { S.pendingPin = {}; renderRight(); return; }
  if (e.target.id === 'csend') postComment();
};
$('#right').onkeydown = e => { if (e.target.id === 'cin' && e.key === 'Enter') postComment(); };
function postComment() { const v = $('#cin').value.trim(); if (!v) return; const d = doc(); const on = S.pendingPin || (S.sel ? { node: S.sel } : {}); d.comments.push({ n: d.comments.length + 1, by: 'you', ago: 'now', on, text: v }); S.pendingPin = null; S.region = null; renderAll(); toast('Posted: agents see it in summary'); }
$('#right').oninput = e => {
  const d = doc(), k = e.target.dataset.num; if (k) { const s = slider(k); const v = s.to ? s.to(+e.target.value) : +e.target.value; const r3 = Math.abs(v) >= 100 ? Math.round(v) : +v.toFixed(4); d.nodes = edit(d.nodes, S.sel, { [k]: r3 }); $(`[data-numv="${k}"]`).textContent = s.fmt(r3); return; }
  const ik = e.target.dataset.input; if (ik) { d.inputs[ik].value = +e.target.value; $(`[data-inputv="${ik}"]`).textContent = (+e.target.value).toFixed(2); return; }
  const pk = e.target.dataset.param; if (pk) { d.params[pk] = Math.round(Math.exp(+e.target.value)); $(`[data-paramv="${pk}"]`).textContent = d.params[pk]; }
};
$('#right').onchange = e => { if (e.target.dataset.num) commit(`~${S.sel}`); else if (e.target.dataset.input || e.target.dataset.param) { rerender(); renderTop(); renderCentre(); renderLeft(); restartKeeping(); toast(e.target.dataset.input ? 'Input changed for listening; the doc keeps its default' : 'Param changed'); } };
$('#ovgrid').onclick = e => { const a = e.target.closest('[data-audition]'); if (a) { e.stopPropagation(); audition(a.dataset.audition); return; } const t = e.target.closest('[data-doc]'); if (t) setDoc(t.dataset.doc); };
$('#feed').onclick = e => { const r = e.target.closest('[data-doc]'); if (r) setDoc(r.dataset.doc); };
$('#pins').onclick = e => { const p = e.target.closest('[data-cmt]'); if (p) { S.tab = 'comments'; renderRight(); } };
$('#regbar').onclick = e => { const b = e.target.closest('[data-rg]'); if (!b) return; const a = b.dataset.rg;
  if (a === 'play') { const was = S.loop; S.loop = false; start(S.region.t[0]); S.loop = was; setTimeout(() => { if (playing() && !S.loop) stop(); }, (S.region.t[1] - S.region.t[0]) * 1000); }
  if (a === 'loop') { S.loop = true; start(S.region.t[0]); }
  if (a === 'zoom') { S.zoom = { t: S.region.t, hz: S.region.hz }; S.region = null; renderCentre(); }
  if (a === 'comment') { S.pendingPin = { t: S.region.t.map(x => +x.toFixed(3)), hz: S.region.hz && S.region.hz.map(Math.round) }; S.tab = 'comments'; renderRight(); setTimeout(() => $('#cin') && $('#cin').focus(), 0); }
  if (a === 'clear') { S.region = null; if (S.loop) { S.loop = false; restartKeeping(); } }
  renderTop(); showRegbar(); };
$('#notesmin').onclick = () => { const n = $('#notes'); n.classList.toggle('min'); $('#notesmin').textContent = n.classList.contains('min') ? 'show' : 'hide'; };

// region drag on the plot
$('#ov').onmousedown = e => { if (S.centre !== 'sound') return; const g = geom(), sp = span(), r = e.target.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top; if (x < G.gut) return;
  const inSpec = y >= g.specT && y <= g.specT + g.specH; DRAG = { x0: x, y0: y, spec: inSpec, moved: false, r: null }; };
addEventListener('mousemove', e => { if (!DRAG) return; const g = geom(), sp = span(), r = $('#ov').getBoundingClientRect(); const x = Math.max(G.gut, Math.min(G.gut + g.pw, e.clientX - r.left)), y = Math.max(g.specT, Math.min(g.specT + g.specH, e.clientY - r.top));
  if (Math.abs(x - DRAG.x0) + Math.abs(y - DRAG.y0) > 4) DRAG.moved = true; if (!DRAG.moved) return;
  const t = [tOf(Math.min(x, DRAG.x0), g, sp), tOf(Math.max(x, DRAG.x0), g, sp)].map(v => Math.max(0, v));
  DRAG.r = DRAG.spec ? { t, hz: [hzOf(Math.max(y, DRAG.y0), g, sp), hzOf(Math.min(y, DRAG.y0), g, sp)] } : { t }; $('#regbar').hidden = true; });
addEventListener('mouseup', e => { if (!DRAG) return; const d = DRAG; DRAG = null;
  if (!d.moved) { const g = geom(), sp = span(); const t = Math.max(0, tOf(d.x0, g, sp)); S.region = null; showRegbar(); if (playing()) start(t); else { OFF = t; } return; }
  S.region = d.r; showRegbar(); renderTop(); });
addEventListener('resize', () => renderCentre());
addEventListener('keydown', e => {
  if (e.key === 'Escape' && (!$('#docpop').hidden || !$('#bpop').hidden)) { $('#docpop').hidden = true; $('#bpop').hidden = true; e.target.blur?.(); return; }
  if (e.target.closest?.('input, textarea')) return; const k = e.key.toLowerCase();
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (k === 'l') $('#loopbtn').click(); else if (k === 'r') $('#seedroll').click();
  else if (k === '1' || k === '2') { S.centre = k === '1' ? 'sound' : 'graph'; renderCentre(); renderNotes(); } 
  else if (k === 'h') { const hb = document.querySelector('[data-hist]'); if (hb) openHist(hb); }
  else if (k === 'c') { S.tab = 'comments'; renderRight(); }
  else if (e.key === 'Escape') { $('#docpop').hidden = true; $('#bpop').hidden = true; if (S.region) { S.region = null; showRegbar(); } else if (S.zoom) { S.zoom = null; renderCentre(); } else if (S.solo) { S.solo = null; rerender(); renderAll(); } }
});
document.addEventListener('mousedown', e => { if (!e.target.closest('#docpop, #docbtn')) $('#docpop').hidden = true; if (!e.target.closest('#bpop, [data-hist]')) $('#bpop').hidden = true; });

rerender(); renderAll(); requestAnimationFrame(overlay);
</script>
