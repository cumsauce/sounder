<meta charset="utf-8">
<title>Sounder Editing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* V4 · editing: everything a person can do without the MCP. Every human edit is a sound_ops batch through
   applyOps (one history step, the server's checks), shown in the strip at the bottom left. Phase 1 is window-concept.html.
   Layout (plan phase 5): top bar = which sound + transport (play, loop, seed) + history menu; centre =
   spectrogram / waveform / loudness with a playhead, or the node graph (its cards carry solo, comment counts and
   warnings); bottom dock = macro knobs; right = node | sound | comments tabs. Tokens match modeler's ds.rs. Phase 5 ships
   this page in a webview with the Rust session behind it. The audio is real: the mock renders the same node JSON in the browser. */
:root {
  color-scheme: dark;
  --bg: #15171c; --panel: #1c1f26; --raise: #252932; --line: #2e333e;
  --fg: #e3e6ec; --dim: #8a91a0; --faint: #5b6270;
  --accent: #6fa8ff; --accent-soft: rgba(111,168,255,.14);
  --ok: #5fc48a; --warn: #e2b24f; --bad: #ec6d6d;
  --a1: #c792ea; --a2: #f6a04d; --a3: #4fd1c5;
  --b: #f6a04d;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.4 var(--sans); overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-size: 12px; }
.app { display: grid; height: 100%; grid-template-rows: 48px 1fr; position: relative; }

/* top bar */
.top { display: flex; align-items: center; gap: 10px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
.where { display: flex; align-items: stretch; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 2px; min-width: 0; }
.where > button { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 6px; color: var(--dim); white-space: nowrap; min-width: 0; }
.where > button[aria-pressed="true"] { background: var(--raise); color: var(--fg); }
.where .count { font: 11px var(--mono); background: var(--raise); border-radius: 99px; padding: 0 6px; color: var(--dim); }
.where > button[aria-pressed="true"] .count { background: var(--bg); }
.docname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.docproj { color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
.transport { display: flex; align-items: center; gap: 6px; }
.transport[hidden] { display: none !important; }
.play { width: 34px; height: 30px; border-radius: 7px; background: var(--accent); color: #08162b; display: grid; place-items: center; }
.play svg.i { fill: currentColor; stroke: none; }
.tbtn { display: flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 6px; color: var(--dim); border: 1px solid var(--line); white-space: nowrap; }
.tbtn:hover { color: var(--fg); background: var(--raise); }
.tbtn[aria-pressed="true"] { color: var(--fg); background: var(--raise); border-color: var(--faint); }
.tbtn kbd, .seg kbd, .tabs kbd { font: 10px var(--mono); color: var(--faint); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
.seed { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seed button { padding: 5px 7px; color: var(--dim); }
.seed button:hover { color: var(--fg); background: var(--raise); }
.seed span { font: 12px var(--mono); padding: 0 6px; min-width: 52px; text-align: center; }
.hearing { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 99px; background: var(--raise); white-space: nowrap; }
.hearing b { color: var(--fg); font-weight: 500; }
.hearing button { color: var(--faint); display: grid; place-items: center; }
.hearing button:hover { color: var(--fg); }
.spacer { flex: 1; }
.agents { display: flex; align-items: center; gap: 4px; }
.agent { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 6px; border-radius: 99px; background: var(--raise); font-size: 12px; color: var(--dim); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.live { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.iconbtn { padding: 5px 9px; border-radius: 6px; color: var(--dim); border: 1px solid var(--line); }
.iconbtn:hover { color: var(--fg); background: var(--raise); }

/* document switcher */
.docpop { position: absolute; top: 44px; left: 10px; width: 360px; max-width: calc(100vw - 20px); max-height: min(520px, 70vh); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); z-index: 30; }
.docpop[hidden], .bpop[hidden] { display: none !important; }
.docpop input { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; margin: 8px; padding: 7px 9px; color: var(--fg); font: inherit; }
.docpop .list { overflow: auto; padding: 0 6px 8px; }
.docrow { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.docrow:hover, .docrow.on { background: var(--raise); }
.docrow .r { color: var(--faint); font-size: 11px; text-align: right; white-space: nowrap; }
.bpop { position: absolute; top: 44px; width: 320px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.5); z-index: 30; padding: 6px; }
.bpop .h { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 6px 8px; }

/* workspace */
.work { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: 1fr auto; min-height: 0; }
.right { background: var(--panel); min-height: 0; overflow: auto; }
.right { border-left: 1px solid var(--line); grid-row: 1 / 3; grid-column: 2; display: flex; flex-direction: column; }
.paneh { position: sticky; top: 0; background: var(--panel); z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 6px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.paneh .badge { text-transform: none; letter-spacing: 0; }
.tree { padding: 0 6px 12px; }
.row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; min-width: 0; color: var(--fg); position: relative; }
.row:hover { background: var(--raise); }
.row.sel { background: var(--accent-soft); }
.row .name { overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.row .meta { color: var(--faint); font-size: 11px; }
.row svg.i { color: var(--dim); }
.row canvas.spark { width: 46px; height: 16px; flex: none; opacity: .9; }
.row .solo { color: var(--faint); display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; opacity: 0; }
.row:hover .solo, .row .solo.on, .row .solo:focus-visible { opacity: 1; }
.row .solo:hover { color: var(--fg); background: var(--bg); }
.row .solo.on { color: var(--accent); }
.row.out .name { font-weight: 600; }
.row .pinc { font: 600 10px var(--sans); background: var(--warn); color: #1b1600; border-radius: 99px; padding: 0 5px; }
.row .warnc { color: var(--warn); display: grid; place-items: center; }
.row.child { padding-left: 14px; }
.badge { font: 10px var(--mono); padding: 0 5px; border-radius: 4px; background: var(--raise); color: var(--dim); white-space: nowrap; }
.badge.loop { color: var(--a3); } .badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); }
.wire { color: var(--faint); font: 11px var(--mono); padding: 0 6px 0 30px; height: 10px; line-height: 8px; }

/* centre */
.view { position: relative; min-height: 0; min-width: 0; display: grid; grid-template-rows: 40px 1fr; background: #121418; }
.hudbar { display: flex; align-items: center; gap: 6px; padding: 0 10px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; overflow: hidden; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px; flex: none; }
.seg button { padding: 3px 9px; border-radius: 4px; color: var(--dim); font-size: 12px; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--fg); }
.chip { background: rgba(21,23,28,.85); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--dim); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.chip b { color: var(--fg); font-weight: 500; }
.chip button { color: var(--faint); display: grid; place-items: center; }
.chip button:hover { color: var(--fg); }
.chip.warn { border-color: rgba(226,178,79,.5); color: var(--warn); }
.plot { position: relative; min-height: 0; overflow: hidden; }
.plot > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.plot canvas#ov { cursor: crosshair; }
.regbar { position: absolute; display: flex; gap: 4px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.45); z-index: 4; }
.regbar[hidden] { display: none !important; }
.regbar button { display: flex; gap: 6px; align-items: center; padding: 4px 8px; border-radius: 5px; color: var(--dim); font-size: 12px; white-space: nowrap; }
.regbar button:hover { background: var(--raise); color: var(--fg); }
.regbar .sep { width: 1px; background: var(--line); margin: 2px 0; }
.pinb { position: absolute; transform: translate(-50%, -50%); width: 20px; height: 20px; border-radius: 50%; background: var(--warn); color: #1b1600; font: 600 11px var(--sans); display: grid; place-items: center; cursor: pointer; z-index: 3; border: 2px solid #121418; }
.pinb.done { background: var(--faint); color: var(--bg); }
.graphhost[hidden] { display: none !important; }
.graphhost { position: absolute; inset: 0; overflow: auto; background-color: #181a20; background-image: radial-gradient(#2a2f3a 1px, transparent 1px); background-size: 18px 18px; }
.graph { position: relative; margin: 24px; }
.graph svg.wires .wport { font: 10px var(--mono); fill: var(--a3); }
.graph svg.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.gnode { position: absolute; width: 150px; padding: 6px 8px 5px; background: var(--raise); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
.gnode.sel { border-color: var(--accent); }
.gnode.solo { box-shadow: 0 0 0 2px rgba(111,168,255,.35); }
.gnode .n { font-size: 12px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; }
.gnode .t { font: 10.5px var(--mono); color: var(--faint); line-height: 1.2; }
.gnode .gsolo { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 5px; color: var(--faint); opacity: 0; }
.gnode:hover .gsolo, .gnode .gsolo.on, .gnode .gsolo:focus-visible { opacity: 1; }
.gnode .gsolo:hover { color: var(--fg); background: var(--bg); }
.gnode .gsolo.on { color: var(--accent); }
.gnode .n { padding-right: 20px; }
.gnode .gbadges { display: flex; gap: 4px; align-items: center; }
.gnode .pinc { font: 600 10px var(--sans); background: var(--warn); color: #1b1600; border-radius: 99px; padding: 0 5px; }
.gnode .warnc { color: var(--warn); display: grid; place-items: center; }
.gnode.out { border-width: 2px; }
.gnode canvas { width: 100%; height: 22px; display: block; margin-top: 4px; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; }
.toast[hidden] { display: none !important; }

/* history dock */
.dock { grid-column: 1; border-top: 1px solid var(--line); background: var(--panel); min-width: 0; }
.dock[hidden] { display: none !important; }
.dockh { display: flex; align-items: center; gap: 10px; padding: 6px 12px; font-size: 12px; color: var(--dim); }
.dockh .t { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.dockh .grow { flex: 1; }
.knobs { display: flex; gap: 8px; padding: 0 12px 10px; overflow-x: auto; }
.knob { flex: none; width: 104px; padding: 8px 8px 7px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; }
.knob.hot { border-color: var(--accent); }
.knob .kn { font-weight: 600; font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
.knob svg.dial { width: 66px; height: 60px; cursor: ns-resize; touch-action: none; outline: none; }
.knob svg.dial:focus-visible { outline: 2px solid var(--accent); border-radius: 50%; }
.knob .kval { font: 12px var(--mono); display: flex; gap: 6px; align-items: baseline; }
.knob .kval .moved { color: var(--a3); font-size: 10.5px; }
.knob .claimx { font-size: 11px; color: var(--faint); text-align: center; line-height: 1.3; min-height: 29px; }
.knob .claimx b { font-weight: 500; }
.knob .claimx .ok { color: var(--ok); } .knob .claimx .bad { color: var(--bad); }
.game { font: 600 9.5px var(--mono); color: #04201d; background: var(--a3); border-radius: 3px; padding: 0 4px; letter-spacing: .03em; }
.knob.add { justify-content: center; color: var(--faint); border-style: dashed; font-size: 12px; text-align: center; padding: 10px; }
.kpop { position: fixed; z-index: 20; width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 14px 40px rgba(0,0,0,.5); padding: 9px 11px; font-size: 12px; pointer-events: none; }
.kpop[hidden] { display: none !important; }
.kpop .d { color: var(--dim); margin-bottom: 6px; }
.kpop .m { font: 11.5px var(--mono); display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
.kpop .m span:nth-child(even) { color: var(--dim); text-align: right; }
.kpop .who { color: var(--faint); margin-top: 6px; font-size: 11px; }
.kpop .who .ok { color: var(--ok); } .kpop .who .bad { color: var(--bad); } .kpop .who b { color: var(--fg); font-weight: 500; }
.row.mac { box-shadow: inset 2px 0 0 var(--accent); background: var(--accent-soft); }
.gnode.mac { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.macchip { font: 11px var(--mono); color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 6px; cursor: pointer; }
.fb { font-size: 12px; display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; }
.fb span:nth-child(even) { color: var(--faint); font-size: 11px; }
.hstep { display: grid; grid-template-columns: 34px 1fr auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.hstep:hover { background: var(--raise); }
.hstep .l { font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hstep .tagA, .hstep .tagB { font: 600 10px var(--mono); border-radius: 3px; padding: 0 4px; }
.hstep .tagA { background: var(--accent); color: #08162b; } .hstep .tagB { background: var(--b); color: #1f1300; }

/* right pane */
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); z-index: 2; }
.tabs button { padding: 6px 10px; color: var(--dim); border-bottom: 2px solid transparent; display: flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
.tabs .n { font: 10px var(--mono); background: var(--warn); color: #1b1600; border-radius: 99px; padding: 0 5px; }
.sect { padding: 8px 12px 14px; border-bottom: 1px solid var(--line); }
.sect:last-child { border-bottom: 0; }
.sh { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 2px 0 8px; display: flex; justify-content: space-between; align-items: center; }
.nodehead { display: flex; align-items: center; gap: 8px; }
.nodehead .nm { font-weight: 600; font-size: 14px; }
.blurb { color: var(--dim); font-size: 12px; margin-top: 4px; }
.physbadge { font: 10px var(--mono); color: var(--a3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.body-card { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px 2px; margin-bottom: 6px; }
.body-card .bh { display: flex; gap: 6px; align-items: center; font-size: 12px; margin-bottom: 4px; } .body-card .bh b { font-weight: 600; }
.hits { display: flex; gap: 2px; align-items: flex-end; height: 34px; margin: 4px 0 8px; border-bottom: 1px solid var(--line); position: relative; }
.rigbar { position: sticky; top: 0; left: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(24,26,32,.92); border-bottom: 1px solid var(--line); font-size: 12px; }
.rigbar button { color: var(--accent); } .rigbar .hint { margin-left: auto; }
.rig { position: relative; margin: 10px 12px; user-select: none; }
.rig svg.rw { position: absolute; inset: 0; overflow: visible; pointer-events: none; z-index: 2; }
.rig svg.rw .ah { pointer-events: all; cursor: ew-resize; stroke: transparent; stroke-width: 10; } .rig svg.rw .ah:hover { r: 6; }
.rig svg.rw .hit { pointer-events: stroke; cursor: pointer; stroke: transparent; stroke-width: 18; fill: none; }
.rig svg.rw text { font: 10px var(--mono); fill: var(--dim); }
.rbody { position: absolute; width: 140px; padding: 6px 8px 5px; background: var(--raise); border: 1px solid var(--line); border-radius: 7px; cursor: pointer; }
.rbody.silent { background: transparent; border-style: dashed; }
.rbody.sel, .rport.sel { border-color: var(--accent); }
.rbody .n { font-size: 12px; font-weight: 500; display: flex; gap: 6px; align-items: center; } .rbody .t { font: 10.5px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rbody { overflow: hidden; }
.rbody canvas { width: 100%; height: 20px; display: block; margin-top: 3px; }
.rbody .pin { color: var(--dim); font: 10px var(--mono); margin-left: auto; }
.rground { position: absolute; height: 12px; border-top: 2px solid var(--dim); background: repeating-linear-gradient(135deg, #3a404c 0 1px, transparent 1px 7px); }
.rground span { position: absolute; left: 0; top: 2px; font: 10px var(--mono); color: var(--faint); }
.rport { position: absolute; padding: 4px 9px; border: 1px solid var(--line); border-radius: 10px; font: 11px var(--mono); background: var(--panel); white-space: nowrap; }
.rport.in { color: var(--a2); } .rport.out { color: var(--a3); } .rport.start { color: var(--dim); border-style: dashed; }
.rbody .tags { margin-left: auto; display: flex; gap: 4px; }
.rbody .n { justify-content: space-between; }
.tag { font: 500 9.5px var(--mono); color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; white-space: nowrap; background: var(--bg); }
.tag.out { color: var(--a3); border-color: rgba(79,209,197,.35); } .tag.in { color: var(--a2); border-color: rgba(246,160,77,.4); } .tag.start { color: var(--fg); }
.rjoint { opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 3; }
.rjoint.sel, .rjoint.hover { opacity: 1; }
.rjoint { position: absolute; transform: translate(0, -50%); font: 10px var(--mono); color: var(--dim); background: #181a20; border: 1px solid var(--line); border-radius: 99px; padding: 1px 7px; white-space: nowrap; cursor: pointer; display: flex; gap: 6px; }
.rjoint.spring { color: var(--a3); } .rjoint span { color: var(--faint); } .rjoint.sel { border-color: currentColor; }
.rpop { position: absolute; z-index: 5; width: 250px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px 10px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
.rpop .rph { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; } .rpop .rph button { margin-left: auto; color: var(--faint); }
.rpop .field { grid-template-columns: 62px 1fr 64px; } .rpop input.dflt { opacity: .45; } .rpop .opts { flex-wrap: wrap; }
/* editing (V4) */
.gtool { position: sticky; top: 0; left: 0; z-index: 4; display: flex; gap: 6px; align-items: center; padding: 8px 12px; background: rgba(24,26,32,.92); border-bottom: 1px solid var(--line); }
.gtool .hint { margin-left: 6px; }
.gnode { touch-action: none; }
.gnode.multi { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.gnode.droptarget { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.gout { position: absolute; right: -7px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--raise); border: 2px solid #6b7281; cursor: crosshair; z-index: 2; opacity: .55; transition: opacity .1s; }
.gnode:hover .gout, .gout.on { opacity: 1; }
.gout:hover, .gout.on { border-color: var(--accent); background: var(--accent); }

// =====================================================================
// Editing (V4): everything a person can do without the MCP
// =====================================================================
// Every human edit is a sound_ops batch ({ops, macros, delete_macros, params, kind, duration, seed, layout}) through
// applyOps: the same checks the server makes, then one history step. The strip at the bottom left shows the batch.
const NODE_SCHEMA = {
  osc: { family: 'sources', f: { freq: ['signal', 440, [20, 20000, 'log']], amp: ['signal', 1, [0, 1]], shape: ['enum', 'sine', ENUMS.shape] } },
  noise: { family: 'sources', f: { color: ['enum', 'white', ENUMS.color], amp: ['signal', 1, [0, 1]] } },
  impulse: { family: 'sources', f: { at: ['num', 0, [0, 2]], amp: ['num', 1, [0, 1]] } },
  decay: { family: 'envelopes', f: { time: ['num', 0.3, [0.005, 4, 'log']], at: ['num', 0, [0, 2]] } },
  env: { family: 'envelopes', f: { points: ['table', [[0, 0], [0.01, 1], [0.3, 0]], ['t', 'v']] } },
  ramp: { family: 'control', f: { from: ['num', 1000, [20, 20000, 'log']], to: ['num', 200, [20, 20000, 'log']], time: ['num', 0.3, [0.005, 4, 'log']], curve: ['enum', 'exp', ENUMS.curve], at: ['num', 0, [0, 2]] } },
  lfo: { family: 'control', f: { freq: ['signal', 5, [0.05, 40, 'log']], range: ['pair', [-1, 1]] } },
  wander: { family: 'control', f: { rate: ['num', 2, [0.05, 40, 'log']], range: ['pair', [-1, 1]] } },
  filter: { family: 'filters', f: { input: ['audio'], mode: ['enum', 'lp', ENUMS.mode], freq: ['signal', 1000, [20, 20000, 'log']], q: ['signal', 0.707, [0.3, 20]], gain_db: ['num', 0, [-24, 24]] } },
  resonators: { family: 'filters', f: { input: ['audio'], modes: ['table', [[440, 0.3, 1]], ['hz', 'decay s', 'gain']] } },
  math: { family: 'maths', f: { op: ['enum', 'mul', ENUMS.op], a: ['audio'], b: ['signal', 1, [0, 8]] } },
  gain: { family: 'maths', f: { input: ['audio'], db: ['num', 0, [-24, 24]] } },
  shape: { family: 'nonlinear', f: { input: ['audio'], drive: ['num', 1, [0, 8]] } },
  delay: { family: 'time', f: { input: ['audio'], time: ['num', 0.25, [0.001, 2, 'log']], feedback: ['num', 0.3, [0, 0.95]] } },
  mix: { family: 'mix', f: { inputs: ['inputs', []] } },
  modal: { family: 'physical', f: { excite: ['audio'], material: ['enum', 'wood', ENUMS.material], shape: ['enum', 'plate', SHAPES], f0: ['num', 300, [40, 8000, 'log']], loss: ['num', 1, [0.1, 4]], noise: ['num', 0, [0, 1]] } },
  impact: { family: 'physical', f: { height: ['num', 0.5, [0.05, 3, 'log']], object_mass: ['num', 1, [0.01, 10, 'log']], bounce: ['num', 0.45, [0, 1]], floor: ['enum', 'concrete', ENUMS.floor], material: ['enum', 'wood', ENUMS.material], shape: ['enum', 'plate', SHAPES], f0: ['num', 300, [40, 8000, 'log']], loss: ['num', 1, [0.1, 4]], noise: ['num', 0, [0, 1]] } },
  rig: { family: 'physical', f: { at: ['num', 0.005, [0, 2]] }, init: () => ({ bodies: [{ name: 'ball', mass: 0.05 }, { name: 'plate', mass: 1, fixed: true, material: 'metal', shape: 'plate', f0: 400, loss: 0.5, noise: 0.4 }], joints: [{ kind: 'contact', a: 'ball', b: 'plate', gap: 0.2, bounce: 0.5 }] }) },
  output: { family: 'output', f: { input: ['audio'], gain_db: ['num', 0, [-24, 24]], lufs: ['num', null, [-40, -6]], peak_db: ['num', null, [-24, 0]], fade_in: ['num', 0.002, [0, 0.05]], fade_out: ['num', 0.005, [0, 0.2]], ceiling_db: ['num', -1, [-12, 0]] } },
};
const FAMILIES = ['sources', 'envelopes', 'control', 'filters', 'maths', 'nonlinear', 'time', 'mix', 'physical'];
const SCH = t => NODE_SCHEMA[t] || { f: {} };
const NAME_RE = /^[a-z_][a-z0-9_]*$/i;
const PORTS = { force: ['rig', 'impact'] };
const freeName = (base, taken) => { if (!taken.has(base)) return base; let i = 2; while (taken.has(base + '_' + i)) i++; return base + '_' + i; };
const isRef = s => typeof s === 'string' && !/^[$=]/.test(s) && !/\s/.test(s) && NAME_RE.test(s.split('.')[0]);

// The signal references of a node, by its schema: [{field, index?, key?, value}]
function refsOf(n) { const out = [], f = SCH(n.type).f;
  for (const [k, spec] of Object.entries(f)) { const v = n[k];
    if (spec[0] === 'inputs') (v || []).forEach((e, i) => { const s = typeof e === 'string' ? e : e && e.input; if (isRef(s)) out.push({ field: k, index: i, value: s }); });
    else if ((spec[0] === 'audio' || spec[0] === 'signal') && isRef(v)) out.push({ field: k, value: v }); }
  if (n.type === 'rig') { (n.bodies || []).forEach((b, i) => { if (isRef(b.drive)) out.push({ field: 'bodies', index: i, key: 'drive', value: b.drive }); }); (n.joints || []).forEach((j, i) => { if (isRef(j.slide)) out.push({ field: 'joints', index: i, key: 'slide', value: j.slide }); }); }
  return out; }
function setRef(c, r, v) { if (r.key) { if (v == null) delete c[r.field][r.index][r.key]; else c[r.field][r.index][r.key] = v; return; }
  const spec = SCH(c.type).f[r.field];
  if (spec && spec[0] === 'inputs') { const e = c.inputs[r.index]; if (v == null) c.inputs[r.index] = undefined; else if (typeof e === 'string') c.inputs[r.index] = v; else e.input = v; return; }
  if (v == null) { if (spec && spec[0] === 'signal' && spec[1] != null) c[r.field] = spec[1]; else delete c[r.field]; } else c[r.field] = v; }
const tidyInputs = c => { if (Array.isArray(c.inputs)) c.inputs = c.inputs.filter(x => x !== undefined); return c; };

function validate(nx) {
  const names = new Set();
  for (const n of nx.nodes) { if (!NAME_RE.test(n.name || '')) return `"${n.name}" is not a valid node name`; if (n.name === 'mono' || n.name === 'stereo') return `"${n.name}" is reserved (a mix "to" word)`; if (names.has(n.name)) return `two nodes are named ${n.name}`; names.add(n.name); }
  const outs = nx.nodes.filter(n => n.type === 'output').length; if (outs !== 1) return outs ? 'a sound has exactly one output' : 'a sound needs an output';
  const by = Object.fromEntries(nx.nodes.map(n => [n.name, n]));
  for (const n of nx.nodes) for (const r of refsOf(n)) { const [b, p] = r.value.split('.'); if (!by[b]) return `${n.name}.${r.field} reads ${r.value}, which is not a node`; if (b === n.name) return `${n.name} reads itself`; if (p && !(PORTS[p] || []).includes(by[b].type)) return `${b} has no port .${p}`; }
  const state = {};
  const dfs = (n, path) => { state[n.name] = 1; for (const r of refsOf(n)) { const m = by[r.value.split('.')[0]]; if (!m) continue;
      if (state[m.name] === 1) { const cyc = path.slice(path.indexOf(m.name)).concat(n.name); if (!cyc.some(x => by[x].type === 'delay')) return `the loop ${cyc.concat(m.name).join(' → ')} needs a delay in it`; }
      else if (!state[m.name]) { const e = dfs(m, path.concat(n.name)); if (e) return e; } }
    state[n.name] = 2; return null; };
  for (const n of nx.nodes) if (!state[n.name]) { const e = dfs(n, []); if (e) return e; }
  const seen = {}, mn = new Set();
  for (const m of nx.macros) { if (!NAME_RE.test(m.name || '')) return `"${m.name}" is not a valid knob name`; if (mn.has(m.name)) return `two knobs are named ${m.name}`; mn.add(m.name);
    for (const e of m.map) { if (e.param) continue; if (!by[e.node]) return `knob ${m.name} maps ${e.node}, which is not a node`;
      if (e.curve === 'exp' && !(e.from > 0 && e.to > 0)) return `knob ${m.name}: an exp curve needs both ends above 0 (${mapText(e)[0]})`;
      const key = [e.node, e.field, e.index ?? '', e.key ?? '', e.col ?? ''].join('|'); if (seen[key]) return `knob ${m.name} and knob ${seen[key]} both write ${mapText(e)[0]}: split the field or drop one`; seen[key] = m.name; } }
  for (const n of nx.nodes.filter(n => n.type === 'rig')) { const bn = new Set();
    if ((n.bodies || []).length > 16) return `${n.name}: at most 16 bodies`; if ((n.joints || []).length > 32) return `${n.name}: at most 32 joints`;
    for (const b of n.bodies || []) { if (!NAME_RE.test(b.name || '') || b.name === 'ground') return `${n.name}: "${b.name}" is not a valid body name`; if (bn.has(b.name)) return `${n.name}: two bodies are named ${b.name}`; bn.add(b.name); }
    for (const j of n.joints || []) { if (!bn.has(j.a)) return `${n.name}: a joint attaches ${j.a}, which is not a body`; if (j.b !== 'ground' && !bn.has(j.b)) return `${n.name}: a joint attaches ${j.b}, which is not a body`; if (j.a === j.b) return `${n.name}: a joint joins ${j.a} to itself`; } }
  if (nx.kind === 'loop' && !nx.duration) return 'a loop needs a duration';
  return null; }

const SNAPK = ['nodes', 'macros', 'params', 'layout', 'kind', 'duration', 'seed'];
const snap = d => clone(Object.fromEntries(SNAPK.map(k => [k, d[k] ?? null])));
function restore(d, h) { const vals = Object.fromEntries(d.macros.map(m => [m.name, m.value])); Object.assign(d, clone(h.snap || { nodes: h.nodes }));
  d.layout ||= { nodes: {}, rigs: {} }; d.params ||= {}; d.macros.forEach(m => { if (vals[m.name] != null) m.value = vals[m.name]; }); }

function applyOps(batch, label) {
  const d = doc(), nx = snap(d); const fail = m => { toast(m); return false; };
  nx.layout = nx.layout || {}; nx.layout.nodes ||= {}; nx.layout.rigs ||= {}; nx.params ||= {};
  for (const op of batch.ops || []) { const i = nx.nodes.findIndex(n => n.name === op.name);
    if (op.type === 'delete') { if (i < 0) return fail(`delete: no node named ${op.name}`); nx.nodes.splice(i, 1); }
    else if (i >= 0) nx.nodes[i] = clone(op); else nx.nodes.push(clone(op)); }
  for (const name of batch.delete_macros || []) { if (!nx.macros.some(m => m.name === name)) return fail(`delete_macros: no knob named ${name}`); nx.macros = nx.macros.filter(m => m.name !== name); }
  for (const m of batch.macros || []) { const i = nx.macros.findIndex(x => x.name === m.name); const v = clone(m); v.default ??= i >= 0 ? nx.macros[i].default : v.value; if (i >= 0) nx.macros[i] = v; else nx.macros.push(v); }
  for (const [k, v] of Object.entries(batch.params || {})) { if (v == null) delete nx.params[k]; else nx.params[k] = v; }
  for (const k of ['kind', 'duration', 'seed']) if (k in batch) nx[k] = k === 'duration' && !batch[k] ? null : batch[k];
  const L = batch.layout; if (L) { if (L.nodes === null) nx.layout.nodes = {}; for (const [k, v] of Object.entries(L.nodes || {})) { if (v == null) delete nx.layout.nodes[k]; else nx.layout.nodes[k] = v; }
    for (const [rig, bs] of Object.entries(L.rigs || {})) { if (bs == null) { delete nx.layout.rigs[rig]; continue; } const t = nx.layout.rigs[rig] ||= {}; for (const [b, v] of Object.entries(bs)) { if (v == null) delete t[b]; else t[b] = v; } } }
  const err = validate(nx); if (err) return fail(err);
  try { evaluate({ ...d, ...nx }, nx.seed, null); } catch (e) { return fail(e.message); }
  Object.assign(d, nx);
  const ci = d.hist.findIndex(h => h.v === d.ver); d.hist = d.hist.slice(0, ci + 1); const v = d.hist[d.hist.length - 1].v + 1; d.ver = v;
  d.hist.push({ v, label, by: 'you', ago: 'now', nodes: clone(d.nodes), snap: snap(d) });
  d.saved = false; logCall('sound_ops', batch);
  if (S.sel && !d.nodes.some(n => n.name === S.sel)) S.sel = null;
  if (S.multi) { S.multi = new Set([...S.multi].filter(x => d.nodes.some(n => n.name === x))); if (!S.multi.size) S.multi = null; }
  rerender(); renderAll(); restartKeeping(); return true; }

// the older edits (inspector sliders, enums, rig popovers) still mutate d.nodes and call commit(): it diffs the
// nodes against the current history step and sends the difference through applyOps
function commit(label) { const d = doc(); const cur = d.hist.find(h => h.v === d.ver); const prev = cur ? (cur.snap ? cur.snap.nodes : cur.nodes) : [];
  const now = d.nodes; d.nodes = clone(prev);
  const ops = now.filter(n => { const p = prev.find(x => x.name === n.name); return !p || JSON.stringify(p) !== JSON.stringify(n); }).map(clone).concat(prev.filter(p => !now.some(n => n.name === p.name)).map(p => ({ type: 'delete', name: p.name })));
  if (!ops.length) { rerender(); renderAll(); return; } applyOps({ ops }, label); }
function jumpTo(v) { const d = doc(), h = d.hist.find(x => x.v === v); if (!h || v === d.ver) return; restore(d, h); d.ver = v; rerender(); renderAll(); restartKeeping(); toast(`v${v} · ${h.label}`); }
function stepHistory(dir) { const d = doc(), i = d.hist.findIndex(h => h.v === d.ver), j = i + dir; if (j < 0 || j >= d.hist.length) return toast(dir < 0 ? 'nothing to undo' : 'nothing to redo'); jumpTo(d.hist[j].v); }

// the strip that shows the last call a human edit made, as an agent would send it
function logCall(tool, args) { const d = doc(); d.lastCall = { tool, args }; renderOpslog(); }
function renderOpslog() { const el = $('#opslog'), d = doc(); if (!el) return; const c = d && d.lastCall; el.hidden = !c || S.view === 'grid'; if (!c) return;
  el.innerHTML = `<b>${c.tool}</b>${el.classList.contains('open') ? JSON.stringify(c.args, null, 1) : JSON.stringify(c.args)}`; }

// ---------- small popovers: a menu / palette and a dialog ----------
let PAL = null;
function openPal({ x, y, title, items, search }) { closePal(); const el = document.createElement('div'); el.className = 'pal'; document.body.appendChild(el); PAL = { el, items, q: '', i: 0 };
  el.innerHTML = `${title ? `<div class="palh">${title}</div>` : ''}${search ? '<input placeholder="Search" autocomplete="off" spellcheck="false">' : ''}<div class="list"></div>`;
  const draw = () => { const q = PAL.q.toLowerCase(), score = t => !q ? 0 : t.label.toLowerCase().startsWith(q) ? 0 : t.label.toLowerCase().includes(q) ? 1 : (t.fam || '').includes(q) ? 2 : 3; let its = PAL.items.filter(t => !q || (t.label + ' ' + (t.fam || '') + ' ' + (t.hint || '')).toLowerCase().includes(q)); if (q) its = its.map((t, i) => [t, i]).sort((a, b) => score(a[0]) - score(b[0]) || a[1] - b[1]).map(x => x[0]); PAL.vis = its; PAL.i = Math.min(PAL.i, Math.max(0, its.length - 1)); let fam = null;
    el.querySelector('.list').innerHTML = its.map((t, i) => { const h = t.fam && t.fam !== fam ? `<div class="fam">${t.fam}</div>` : ''; fam = t.fam; return `${h}<button data-pi="${i}" class="${i === PAL.i ? 'on' : ''}" ${t.disabled ? 'disabled' : ''}><span>${t.label}</span>${t.hint ? `<span class="hint">${t.hint}</span>` : ''}</button>`; }).join('') || '<div class="hint" style="padding:6px 8px">nothing matches</div>'; };
  draw(); PAL.draw = draw;
  el.style.left = Math.max(8, Math.min(innerWidth - 300, x)) + 'px'; el.style.top = Math.max(8, Math.min(innerHeight - Math.min(400, el.offsetHeight) - 8, y)) + 'px';
  const inp = el.querySelector('input'); if (inp) { inp.focus(); inp.oninput = () => { PAL.q = inp.value; PAL.i = 0; draw(); }; }
  el.onkeydown = e => { if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); PAL.i = Math.max(0, Math.min(PAL.vis.length - 1, PAL.i + (e.key === 'ArrowDown' ? 1 : -1))); draw(); el.querySelector('.on')?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter') { e.preventDefault(); const t = PAL.vis[PAL.i]; if (t) { closePal(); t.act(); } } };
  if (!inp) { el.tabIndex = -1; el.focus(); }
  const born = performance.now(); el.onclick = e => { if (performance.now() - born < 300) return; const b = e.target.closest('[data-pi]'); if (!b) return; const t = PAL.vis[+b.dataset.pi]; closePal(); t.act(); }; }
function closePal() { if (PAL) { PAL.el.remove(); PAL = null; } }
document.addEventListener('mousedown', e => { if (PAL && !e.target.closest('.pal')) closePal(); if (!e.target.closest('#kedit, .knob, #mapbar') && !$('#kedit').hidden && !S.mapArm) $('#kedit').hidden = true; });

function openDlg(title, fields, primary, onOk) { const el = $('#dlg');
  el.innerHTML = `<div class="dlgbox"><div class="dlgh">${title}<button data-dlgx>${ic('x')}</button></div>${fields.map(f => `<label class="dfield"><span>${f.label}</span>${f.kind === 'select' ? `<select data-dk="${f.key}">${f.options.map(o => `<option ${o === f.value ? 'selected' : ''}>${o}</option>`).join('')}</select>` : f.kind === 'area' ? `<textarea data-dk="${f.key}" rows="3">${f.value || ''}</textarea>` : `<input data-dk="${f.key}" type="${f.kind || 'text'}" value="${f.value ?? ''}" ${f.step ? `step="${f.step}"` : ''}>`}</label>`).join('')}<div class="dlgf"><button class="tbtn" data-dlgx>Cancel</button><button class="primary" data-dlgok>${primary}</button></div></div>`;
  el.hidden = false; el.onclick = e => { if (e.target === el || e.target.closest('[data-dlgx]')) { el.hidden = true; return; } if (e.target.closest('[data-dlgok]')) { const v = Object.fromEntries([...el.querySelectorAll('[data-dk]')].map(i => [i.dataset.dk, i.type === 'number' ? +i.value : i.value])); el.hidden = true; onOk(v); } };
  el.querySelector('[data-dk]')?.focus(); }

// ---------- signal graph: add, connect, delete, rename, duplicate ----------
function addNode(type, at) { const d = doc(), s = SCH(type), name = freeName(type, new Set(d.nodes.map(n => n.name)));
  const n = { type, name }; for (const [k, sp] of Object.entries(s.f)) { if (sp[0] === 'audio') continue; if (sp[0] === 'inputs') n[k] = []; else if (sp[1] != null) n[k] = clone(sp[1]); }
  Object.assign(n, s.init ? s.init() : {});

  if (mod && k === 'z') { e.preventDefault(); e.stopImmediatePropagation(); stepHistory(e.shiftKey ? 1 : -1); return; }
  if (mod && k === 'y') { e.preventDefault(); e.stopImmediatePropagation(); stepHistory(1); return; }
  if (mod && k === 'd') { e.preventDefault(); e.stopImmediatePropagation(); if (S.sel) duplicateNodes(S.multi ? [...S.multi] : [S.sel]); return; }
  if (mod) return;
  if (k === 'a') { e.preventDefault(); e.stopImmediatePropagation(); openAddAtCentre(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); e.stopImmediatePropagation();
    if (S.openRig && S.centre === 'graph') { if (S.rigSel && rigNode(S.openRig)?.type === 'rig') deleteRigPart(S.openRig, S.rigSel); return; }
    if (S.wireSel) return disconnect(S.wireSel); if (S.multi) return deleteNodes([...S.multi]); if (S.sel) deleteNodes([S.sel]); } }, true);
$('#opslog').addEventListener('click', () => { $('#opslog').classList.toggle('open'); renderOpslog(); });

// every sound starts with an empty layout and an exact snapshot for its current step
DOCS.forEach(d => { d.layout ||= { nodes: {}, rigs: {} }; const h = d.hist.find(x => x.v === d.ver); if (h && !h.snap) h.snap = snap(d); });

const TEMPLATES = DOCS.filter(d => ['door_knock', 'pan_and_lid'].includes(d.id)).map(d => clone({ ...d, hist: undefined }));
$('#docpop').addEventListener('click', e => { if (e.target.closest('[data-newsound]')) newSound(); else if (e.target.closest('[data-dupsound]')) newSound(doc());
  else if (e.target.closest('[data-tplsound]')) { const r = e.target.getBoundingClientRect(); openPal({ x: r.left, y: r.bottom + 4, title: 'From a template', items: TEMPLATES.map(t => ({ label: t.id, hint: `${t.nodes.length} nodes`, act: () => newSound(t, true) })) }); } });

rerender(); renderAll(); requestAnimationFrame(overlay);
</script>
